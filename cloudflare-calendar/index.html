<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07182f" />
    <meta name="description" content="Calendario MiPolitico, ejecutado de forma nativa en Cloudflare." />
    <title>Calendario | MiPolitico</title>
  </head>
  <body>
    <a class="skip-link" href="#calendar" data-i18n="skip">Saltar al calendario</a>
    <header class="app-header">
      <a class="brand" href="/" aria-label="MiPolitico Calendar inicio">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span><strong>MiPolitico</strong><small data-i18n="brandSub">Calendario</small></span>
      </a>
      <div class="header-actions">
        <label id="workspace-picker-label" class="workspace-picker" hidden><span data-i18n="workspaceLabel">Espacio</span>
          <select id="workspace-picker" aria-label="Espacio de trabajo del calendario"></select>
        </label>
        <label id="department-picker-label" class="workspace-picker" hidden><span data-i18n="departmentLabel">Departamento</span>
          <select id="department-picker" data-i18n-aria="departmentLabel" aria-label="Departamento"></select>
        </label>
        <a id="admin-link" class="admin-link" href="/admin" data-i18n="admin" hidden>Administración</a>
        <span id="auth-status" class="auth-status" data-i18n="readOnly">Solo lectura</span>
        <button id="new-event" class="primary" type="button" data-i18n="newEvent" hidden>Nuevo evento</button>
        <button id="auth-button" type="button" data-i18n="manage">Administrar</button>
      </div>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow" data-i18n="introEyebrow">Agenda pública</p>
          <h1 id="page-title" data-i18n="pageTitle">Calendario MiPolitico</h1>
          <p data-i18n="intro">Organiza reuniones, eventos y actividades desde un servicio independiente en Cloudflare.</p>
        </div>
        <div class="legend" aria-label="Categorías" data-i18n-aria="categories">
          <span><i class="dot dot-public"></i><span data-i18n="public">Público</span></span>
          <span><i class="dot dot-team"></i><span data-i18n="team">Equipo</span></span>
          <span><i class="dot dot-private"></i><span data-i18n="private">Privado</span></span>
        </div>
      </section>
      <section id="calendar-shell" class="calendar-shell" aria-busy="true">
        <div id="calendar"></div>
      </section>
    </main>

    <dialog id="auth-dialog">
      <form id="auth-form" class="dialog-card">
        <button class="dialog-close" type="button" data-close aria-label="Cerrar" data-i18n-aria="close">×</button>
        <p class="eyebrow" data-i18n="secureAccess">Acceso seguro</p>
        <h2 data-i18n="authTitle">Administrar calendario</h2>
        <label><span data-i18n="password">Contraseña</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="auth-error" class="form-error" role="alert"></p>
        <button class="primary" type="submit" data-i18n="login">Iniciar sesión</button>
      </form>
    </dialog>

    <dialog id="event-dialog">
      <form id="event-form" class="dialog-card event-form">
        <button class="dialog-close" type="button" data-close aria-label="Cerrar" data-i18n-aria="close">×</button>
        <p class="eyebrow" data-i18n="agenda">Agenda</p>
        <h2 id="event-dialog-title" data-i18n="event">Evento</h2>
        <input id="event-id" type="hidden" />
        <label><span data-i18n="title">Título</span><input id="event-title" maxlength="200" required /></label>
        <div class="form-row">
          <label><span data-i18n="start">Inicio</span><input id="event-start" type="datetime-local" required /></label>
          <label><span data-i18n="end">Fin</span><input id="event-end" type="datetime-local" required /></label>
        </div>
        <label class="check"><input id="event-all-day" type="checkbox" /> <span data-i18n="allDay">Evento de todo el día</span></label>
        <label id="event-department-label" hidden><span data-i18n="department">Departamento</span>
          <select id="event-department"></select>
        </label>
        <label><span data-i18n="category">Categoría</span>
          <select id="event-calendar"><option value="public" data-i18n="public">Público</option><option value="team" data-i18n="team">Equipo</option><option value="private" data-i18n="private">Privado</option></select>
        </label>
        <label><span data-i18n="location">Ubicación</span><input id="event-location" maxlength="300" /></label>
        <label><span data-i18n="description">Descripción</span><textarea id="event-description" maxlength="4000" rows="4"></textarea></label>
        <p id="event-error" class="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button id="delete-event" class="danger" type="button" data-i18n="delete" hidden>Eliminar</button>
          <span class="spacer"></span>
          <button type="button" data-close data-i18n="cancel">Cancelar</button>
          <button id="save-event" class="primary" type="submit" data-i18n="save">Guardar</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
