name: Deploy MiPolitico Cloudflare Calendar

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mipolitico-calendar-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-calendar
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-calendar/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply CALENDAR_DB --remote
      - run: npm run deploy
